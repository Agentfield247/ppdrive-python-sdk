[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ppdrive"
version = "0.1.0"
description = "Python SDK for PPDRIVE — self-hosted object storage"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "YOUR NAME" },
]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "ruff",
    "mypy",
]

[project.urls]
Homepage = "https://github.com/dududaa/ppdrive"
Repository = "https://github.com/YOUR_USERNAME/ppdrive-python-sdk"

[tool.hatch.build.targets.wheel]
packages = ["src/ppdrive"]
